<header class="navbar">
  <a routerLink="/" class="logo">🏋️ MiGym</a>

  <nav>
    <ul>
      <li>
        <a routerLink="/">Clases</a>
        @if (auth.esUser()) {
          <li>
            <a routerLink="/my-classes">Mis Clases</a>
          </li>
        }
        @if (auth.esUser()) {
          <li>
            <a routerLink="/my-classes">Administrar Clases</a>
          </li>
          <li>
            <a routerLink="/admin/users">Usuarios</a>
          </li>
        }
      </li>
    </ul>
  </nav>

  <div class="sesion">
    // Nombre del usuario + rol + logout ó login
    @if (auth.usuario(); as u) {
      <p>{{ u.nombre }}</p>
      <button (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login">Ingresar</a>
    }
  </div>
</header>
